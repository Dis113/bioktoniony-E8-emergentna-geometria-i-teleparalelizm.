name: POM-1 Lean 4 verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Lean and mathlib
        shell: bash
        run: |
          lean --version
          lake --version
          lake update
          lake exe cache get

      - name: Compile POM-1 proofs
        run: lake build

      - name: Inspect proof axioms
        shell: bash
        run: |
          cat > POM1AxiomAudit.lean <<'EOF'
          import POM1
          #print axioms POM1.doubledRoot_norm_sq
          #print axioms POM1.doubledRoot_second_moment
          #print axioms POM1.root_second_moment
          #print axioms POM1.rootPotential_nonneg
          #print axioms POM1.mass_shift_identity
          #print axioms POM1.zero_energy_forces_trivial_field
          #print axioms POM1.channelLoop_witness
          #print axioms POM1.triangle_frustrated_mode_negative
          #print axioms POM1.pentad_frustrated_mode_negative
          #print axioms POM1.pentad_square_completion
          #print axioms POM1.pentad_lower_bound
          #print axioms POM1.sector_gap_nonneg
          #print axioms POM1.sector_potential_lower_bound
          #print axioms POM1.sector_potential_witness
          #print axioms POM1.sector_witness_positive_area
          #print axioms POM1.sector_gap_zero_conditions
          #print axioms POM1.sector_minimum_forces_ordering
          #print axioms POM1.coefficient_boundary
          #print axioms POM1.ordered_when
          #print axioms POM1.trivial_when
          #print axioms POM1.coexistence_nonneg
          #print axioms POM1.ordered_slope_factor
          #print axioms POM1.metastable_slope_factor
          #print axioms POM1.metastable_barrier_above_local_min
          #print axioms POM1.even_total_iff_equal_site_parity
          #print axioms POM1.mixed_singleton_forbidden_in_even_sector
          #print axioms POM1.pair_source_preserves_total_parity
          #print axioms POM1.single_hop_preserves_total_parity
          #print axioms POM1.odd_total_iff_mixed_parity
          #print axioms POM1.quaternionOverlapAB_five_eighths
          #print axioms POM1.aligned_bond_stronger
          #print axioms POM1.two_sector_bulk_gap
          #print axioms POM1.overlap_contrast_needed
          #print axioms POM1.quaternionOverlapAC_half
          #print axioms POM1.binary_overlap_is_ising
          #print axioms POM1.POM6_B_not_minimal_for_projector_frustration
          #print axioms POM1.positive_bond_forces_equal_fields
          #print axioms POM1.periodFourLocal_saturation_iff_opposite
          #print axioms POM1.trial_full_vacuum_beats_binary_period_four
          #print axioms POM1.trial_frame_orthonormal
          #print axioms POM1.equal_sector_bond
          #print axioms POM1.different_sector_bond
          #print axioms POM1.fibonacci_weak_count_8_13
          #print axioms POM1.fibonacci_weak_count_21_34
          #print axioms POM1.uniform_sector_no_bond_modulation
          #print axioms POM1.loop_is_energetically_selected
          #print axioms POM1.loop_preference_robust
          #print axioms POM1.spiral_selected_cosine
          #print axioms POM1.irrational_chosen_twist
          #print axioms POM1.irrational_berry_flux
          #print axioms POM1.qwz_gap_lower_bound
          #print axioms POM1.qwz_selected_chiral_gap
          #print axioms POM1.loop_cubic_factorization
          #print axioms POM1.loop_lower_eigenvalue_root
          #print axioms POM1.loop_upper_eigenvalue_root
          #print axioms POM1.loop_gap_exceeds_47_100
          #print axioms POM1.loop_gap_survives_eigenvalue_perturbation
          EOF
          lake env lean POM1AxiomAudit.lean 2>&1 | tee POM1AxiomAudit.log
          if grep -q 'sorryAx' POM1AxiomAudit.log; then
            echo "Unexpected sorryAx detected"
            exit 1
          fi

      - name: Reject unproven placeholders
        shell: bash
        run: |
          if grep -R -nE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)' POM1/*.lean POM1.lean; then
            echo "Admitted Lean proof detected"
            exit 1
          fi

  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install -r Simulations/requirements.txt
      - name: Run POM-1 Hamiltonian numerical checks
        run: |
          python Simulations/pom1_model.py
          python Simulations/emergent_geometry_probe.py
          python Simulations/ordered_phase_probe.py
          python Simulations/sector_vacuum_probe.py
          python Simulations/sector_motion_probe.py
          python Simulations/emgr_metastability_probe.py
          python Simulations/singleton_channel_probe.py
          python Simulations/singleton_sector_transport.py
          python Simulations/spectral_topological_probe.py
          python Simulations/spontaneous_ordering_probe.py
          python Simulations/continuous_sector_frustration.py
          python Simulations/full_vacuum_ordering_probe.py
          python Simulations/fibonacci_planck_flux.py
          python Simulations/self_generated_flux_probe.py
          python Simulations/exact_loop_spectrum.py
